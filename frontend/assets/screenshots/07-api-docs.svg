<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b288;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg)"/>
  <!-- Nav bar -->
  <rect width="1200" height="60" fill="rgba(0,0,0,0.25)"/>
  <text x="24" y="38" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="white">KeyProse</text>
  <text x="900" y="38" font-family="system-ui,sans-serif" font-size="14" fill="rgba(255,255,255,0.8)">Listing Writer</text>
  <text x="1010" y="38" font-family="system-ui,sans-serif" font-size="14" fill="rgba(255,255,255,0.8)">CMA Tool</text>
  <text x="1090" y="38" font-family="system-ui,sans-serif" font-size="14" fill="rgba(255,255,255,0.8)">Social</text>
  <!-- Main content area -->
  <rect x="40" y="100" width="1120" height="580" rx="16" fill="rgba(255,255,255,0.12)"/>
  <!-- Title -->
  <text x="600" y="300" font-family="system-ui,sans-serif" font-size="64" font-weight="800" fill="white" text-anchor="middle">API Reference</text>
  <text x="600" y="360" font-family="system-ui,sans-serif" font-size="28" fill="rgba(255,255,255,0.85)" text-anchor="middle">OpenAPI / Swagger Documentation</text>
  <!-- Branding -->
  <rect x="460" y="420" width="280" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="600" y="452" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">KeyProse</text>
  <!-- Decorative elements -->
  <circle cx="150" cy="400" r="80" fill="rgba(255,255,255,0.06)"/>
  <circle cx="1050" cy="350" r="100" fill="rgba(255,255,255,0.06)"/>
  <circle cx="600" cy="600" r="60" fill="rgba(255,255,255,0.04)"/>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Real Estate AI</title>
  <style>
    :root { --primary:#1e50a0; --accent:#f59e0b; --bg:#f8fafc; --text:#1e293b; --muted:#64748b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
    nav { background:var(--primary); color:#fff; padding:0.8rem 1.25rem; }
    nav a { color:#fff; font-weight:700; text-decoration:none; }
    main { flex:1; display:flex; align-items:center; justify-content:center; padding:3rem 1.25rem; }
    .card { max-width:560px; background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:2.5rem 2rem; text-align:center; box-shadow:0 8px 30px rgba(30,80,160,0.08); }
    h1 { font-size:2rem; margin:0.5rem 0 0.75rem; }
    p { color:var(--muted); line-height:1.6; }
    .actions { display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap; margin-top:1.5rem; }
    .btn { display:inline-block; padding:0.7rem 1.1rem; border-radius:8px; text-decoration:none; font-weight:700; }
    .btn-primary { background:var(--accent); color:#1e293b; }
    .btn-outline { border:1.5px solid #cbd5e1; color:var(--primary); }
  </style>
</head>
<body>
  <nav><a href="/">🏠 Real Estate AI</a></nav>
  <main>
    <div class="card">
      <div style="font-size:2rem;">404</div>
      <h1>Page not found</h1>
      <p>That address is not part of this demo. The five tools and the API reference are linked from the home page.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Back home</a>
        <a class="btn btn-outline" href="/docs">API docs</a>
      </div>
    </div>
  </main>
</body>
</html>

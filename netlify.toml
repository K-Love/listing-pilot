# Publish the static UI. /api/* is netlify/functions/api.mjs: sample copy, or a
# live Chat Completions call when OPENAI_API_KEY is set. The Python app in
# backend/server.py uses the same AI_BASE_URL / model variables.
[build]
  publish = "frontend"

# Live completions need longer than the 10s default. 26s is the sync maximum.
[functions.api]
  timeout = 26

[[redirects]]
  from = "/docs"
  to = "/api-docs.html"
  status = 200

[[redirects]]
  from = "/tools/listing"
  to = "/tools/listing.html"
  status = 200

[[redirects]]
  from = "/tools/cma"
  to = "/tools/cma.html"
  status = 200

[[redirects]]
  from = "/tools/social"
  to = "/tools/social.html"
  status = 200

[[redirects]]
  from = "/tools/email"
  to = "/tools/email.html"
  status = 200

[[redirects]]
  from = "/tools/outreach"
  to = "/tools/outreach.html"
  status = 200

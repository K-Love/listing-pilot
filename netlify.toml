# Publish the static UI. Netlify functions are JavaScript-only, so /api/*
# is a demo implementation of the same endpoints as `python backend/server.py`.
# Self-host that Python app, or the Dockerfile, for OpenAI-backed generation.
[build]
  publish = "frontend"

[[redirects]]
  from = "/docs"
  to = "/api-docs.html"
  status = 200

[[redirects]]
  from = "/tools/listing"
  to = "/tools/listing.html"
  status = 200

[[redirects]]
  from = "/tools/cma"
  to = "/tools/cma.html"
  status = 200

[[redirects]]
  from = "/tools/social"
  to = "/tools/social.html"
  status = 200

[[redirects]]
  from = "/tools/email"
  to = "/tools/email.html"
  status = 200

[[redirects]]
  from = "/tools/outreach"
  to = "/tools/outreach.html"
  status = 200
